name: gmail_enhancer_final
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  timezone: ^0.9.4
  html_unescape: ^2.0.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.1.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.10.0
  googleapis: ^11.3.0
  googleapis_auth: ^1.3.0
  http: ^1.1.0
  provider: ^6.1.0
  flutter_dotenv: ^5.2.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  firebase_auth_web: ^5.10.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/.env   # keep env hidden file

# ---------------------------
# ✅ App Icon Configuration
# ---------------------------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

# ---------------------------
# ✅ Splash Screen Configuration (Android 12 / 13 Supported)
# ---------------------------
flutter_native_splash:
  android: true
  ios: false
  web: false
  image: assets/logo.png
  color: "#FFFFFF"
  fullscreen: true

  android_12:
    image: assets/logo.png
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
